<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Call Transcriber</title>
  <style>
    body { font-family: monospace; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    h1   { border-bottom: 2px solid black; padding-bottom: 10px; }
    button {
      padding: 12px 24px;
      font-size: 16px;
      cursor: pointer;
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover { background: #c0392b; }
    #status { margin-top: 10px; color: #555; font-size: 14px; }
    .transcript-item {
      padding: 8px 12px;
      margin: 6px 0;
      background: #f4f4f4;
      border-left: 4px solid #3498db;
    }
    .transcript-time { font-size: 11px; color: #999; }
  </style>
</head>
<body>

  <h1>📞 Call Transcriber</h1>

  <!-- ── Call Controls ── -->
  <section>
    <h2>Call Controls</h2>
    <button onclick="transferCall()">🔀 Transfer Call to Friend</button>
    <div id="status"></div>
  </section>

  <!-- ── Live Transcriptions ── -->
  <section>
    <h2>Transcriptions <span style="font-size:13px;color:#999;">(auto-refreshes every 3s)</span></h2>
    <div id="transcriptions">
      <!-- Server-rendered on initial page load -->
      {% for t in transcriptions %}
        <div class="transcript-item">
          <div class="transcript-time">{{ t.created_at }}</div>
          <div>{{ t.text }}</div>
        </div>
      {% else %}
        <p style="color:#999;">No transcriptions yet. Make a call!</p>
      {% endfor %}
    </div>
  </section>

  <script>
    // ── Transfer the call ──
    async function transferCall() {
      document.getElementById("status").textContent = "Transferring...";
      try {
        const res  = await fetch("/transfer-call", { method: "POST" });
        const data = await res.json();
        if (data.error) {
          document.getElementById("status").textContent = "❌ " + data.error;
        } else {
          document.getElementById("status").textContent = "✅ Transferred to " + data.to;
        }
      } catch (err) {
        document.getElementById("status").textContent = "❌ Error: " + err;
      }
    }

    // ── Poll for new transcriptions every 3 seconds ──
    async function refreshTranscriptions() {
      try {
        const res  = await fetch("/transcriptions");
        const data = await res.json();
        const div  = document.getElementById("transcriptions");

        if (data.length === 0) {
          div.innerHTML = '<p style="color:#999;">No transcriptions yet. Make a call!</p>';
          return;
        }

        div.innerHTML = data.map(t => `
          <div class="transcript-item">
            <div class="transcript-time">${t.created_at}</div>
            <div>${t.text}</div>
          </div>
        `).join("");
      } catch (err) {
        console.error("Failed to refresh transcriptions:", err);
      }
    }

    setInterval(refreshTranscriptions, 3000);
  </script>

</body>
</html>
